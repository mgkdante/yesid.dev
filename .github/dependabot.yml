# Homework #16 (operator decision 2026-07-01): monthly grouped dependabot,
# GitHub Actions only. Actions updates touch CI config and run every check.
# Package updates stay manual; npm/bun ecosystems are deliberately NOT enrolled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
