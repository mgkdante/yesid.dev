name: web

# CI runs on every PR and manual dispatch. ci-work keeps all existing checks.
# classify selects e2e unless a PR changes only audited root documentation;
# manual runs select all.
# Deliberately no push trigger (Q28): strict up-to-date branch protection and
# squash merges mean the last PR run tested exactly what lands on main.
# Policy CLI/env changes require a two-step migration: this PR runs base policy;
# later PRs run the policy landed on main through their own workflow.
# A shared build artifact serves E2E; the aggregate gate requires both lanes.
# The always-run required ci gate includes classification, prerelease-guard, ci-work and e2e.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turbo Remote Cache: when TURBO_TOKEN (a Vercel access token) and TURBO_TEAM
# (the Vercel team slug) are set as a repo secret + variable, `turbo run` shares
# a content-addressed cache across every run/branch/PR, so check/test/build go
# near-instant on unchanged inputs (even on a fresh PR). The credential is
# scoped only to the steps that invoke Turbo; every action and other step
# stays outside that trust boundary. Empty values degrade gracefully to the
# local .turbo/cache. One-time setup: `bunx turbo login && bunx turbo link`,
# then add the TURBO_TOKEN secret + TURBO_TEAM variable.

jobs:
  prerelease-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Test prerelease guard
        run: bun .github/scripts/design-prerelease-guard.mjs --self-test
      - name: Require stable design dependencies
        run: bun .github/scripts/design-prerelease-guard.mjs

  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Keep policy dependencies and load-time data under .github/scripts. The
      # current closure uses only node:fs and git; never resolve PR config/modules.
      - name: Materialize trusted policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          force_e2e=false
          if [[ "$EVENT_NAME" == merge_group ]]; then
            if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] &&
              git merge-base --is-ancestor "$BASE_SHA" origin/main &&
              git cat-file -e "$BASE_SHA:.github/scripts/web-ci.ts" &&
              git cat-file -e "$BASE_SHA:.bun-version"; then
              revision="$BASE_SHA"
            else
              echo '::warning::Unreadable or untrusted merge-group base; use main policy and run everything.'
              revision="$(git rev-parse origin/main)"
              force_e2e=true
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git merge-base --is-ancestor "$BASE_SHA" origin/main
            revision="$BASE_SHA"
          else
            revision="$(git rev-parse origin/main)"
          fi
          policy_dir="$(mktemp -d "$RUNNER_TEMP/web-ci.XXXXXX")"
          git ls-tree -r --name-only -z "$revision" -- .github/scripts > "$policy_dir/paths"
          while IFS= read -r -d '' path; do
            mkdir -p "$policy_dir/$(dirname "$path")"
            git show "$revision:$path" > "$policy_dir/$path"
          done < "$policy_dir/paths"
          git show "$revision:.bun-version" > "$policy_dir/.bun-version"
          test -s "$policy_dir/.github/scripts/web-ci.ts"
          echo "directory=$policy_dir" >> "$GITHUB_OUTPUT"
          echo "git_dir=$(git rev-parse --absolute-git-dir)" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "force_e2e=$force_e2e" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ steps.policy.outputs.directory }}/.bun-version
      - name: Select e2e
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          FORCE_E2E: ${{ steps.policy.outputs.force_e2e }}
          GIT_DIR: ${{ steps.policy.outputs.git_dir }}
          GIT_WORK_TREE: ${{ github.workspace }}
        working-directory: ${{ steps.policy.outputs.directory }}
        shell: bash
        run: |
          if [[ "$FORCE_E2E" == true ]]; then
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          else
            bun .github/scripts/web-ci.ts classify
          fi

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build site and run build contracts
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          EXPORT_FALLBACKS_SOURCE: "fixture"
          PUBLIC_PLAUSIBLE_DOMAIN: "yesid.dev"
        run: bun x turbo run build --filter=@repo/web
      - name: Client payload budgets
        working-directory: apps/web
        run: bun run check:client-payload
      - name: Content-Security-Policy check
        working-directory: apps/web
        run: bun run check:csp
      - name: Package preview output
        run: tar -czf "$RUNNER_TEMP/web-build.tar.gz" -C apps/web .svelte-kit/output
      - name: Upload prebuilt site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-build-${{ github.sha }}
          path: ${{ runner.temp }}/web-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  ci-work:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Test CI decisions
        run: bun test ./.github/scripts/web-ci*.test.ts ./.github/scripts/e2e-shards.test.ts

      - name: Type check and unit tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          EXPORT_FALLBACKS_SOURCE: "fixture"
          PUBLIC_PLAUSIBLE_DOMAIN: "yesid.dev"
        run: bun x turbo run check test --filter=@repo/web

      - name: Brand gates
        run: bun run --cwd apps/web lint:design

      - name: Product shared-package tests
        run: bun run --cwd packages/shared test

  # ── E2E (Playwright) against a local hermetic preview ──────────────────────
  # The webServer previews the fixture build on :4173: no CMS calls and no
  # Vercel edge requests.
  e2e:
    if: >-
      ${{ needs.classify.outputs.e2e != 'false' }}
    # Wait for the site artifact, independently of ci-work checks.
    needs: [classify, build]
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.59 refuses to install Chromium.
    runs-on: ubuntu-24.04
    # Four duration-balanced file groups retain the configured two workers per runner.
    timeout-minutes: 30
    # The assignment includes every discovered spec, including files without timing history.
    # Each shard previews the same site built in the build job.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      # The runner image already ships Chromium's system libraries. --with-deps
      # only added extra fonts and package upgrades through apt, which a slow
      # Ubuntu mirror stalled for up to 10 minutes. The browser download takes seconds.
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/web
        run: bun -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Keep the idempotent install on cache hits to validate the required revision.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bun x playwright install chromium

      - name: Download prebuilt site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build-${{ github.sha }}
          path: ${{ runner.temp }}/web-build
      - name: Restore prebuilt site
        run: tar -xzf "$RUNNER_TEMP/web-build/web-build.tar.gz" -C apps/web

      - name: Playwright e2e (shard ${{ matrix.shard }}/4, local hermetic preview)
        working-directory: apps/web
        env:
          E2E_PREBUILT: "1"
        run: >-
          bun ../../.github/scripts/e2e-shards.ts ${{ matrix.shard }}
          --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 14

  ci:
    if: always()
    needs: [classify, build, ci-work, e2e, prerelease-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Keep policy dependencies and load-time data under .github/scripts. The
      # current closure uses only node:fs and git; never resolve PR config/modules.
      - name: Materialize trusted policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          force_e2e=false
          if [[ "$EVENT_NAME" == merge_group ]]; then
            if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] &&
              git merge-base --is-ancestor "$BASE_SHA" origin/main &&
              git cat-file -e "$BASE_SHA:.github/scripts/web-ci.ts" &&
              git cat-file -e "$BASE_SHA:.bun-version"; then
              revision="$BASE_SHA"
            else
              echo '::warning::Unreadable or untrusted merge-group base; use main policy and run everything.'
              revision="$(git rev-parse origin/main)"
              force_e2e=true
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git merge-base --is-ancestor "$BASE_SHA" origin/main
            revision="$BASE_SHA"
          else
            revision="$(git rev-parse origin/main)"
          fi
          policy_dir="$(mktemp -d "$RUNNER_TEMP/web-ci.XXXXXX")"
          git ls-tree -r --name-only -z "$revision" -- .github/scripts > "$policy_dir/paths"
          while IFS= read -r -d '' path; do
            mkdir -p "$policy_dir/$(dirname "$path")"
            git show "$revision:$path" > "$policy_dir/$path"
          done < "$policy_dir/paths"
          git show "$revision:.bun-version" > "$policy_dir/.bun-version"
          test -s "$policy_dir/.github/scripts/web-ci.ts"
          echo "directory=$policy_dir" >> "$GITHUB_OUTPUT"
          echo "git_dir=$(git rev-parse --absolute-git-dir)" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "force_e2e=$force_e2e" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ steps.policy.outputs.directory }}/.bun-version
      - name: Required CI decision
        env:
          NEEDS: ${{ toJSON(needs) }}
          BUILD_RESULT: ${{ needs.build.result }}
        working-directory: ${{ steps.policy.outputs.directory }}
        run: |
          # Enforce the new dependency even while main still has the old policy.
          if [ "$BUILD_RESULT" != success ]; then
            echo 'Required artifact build did not succeed'
            exit 1
          fi
          bun .github/scripts/web-ci.ts required

  # ── Merge the shard blob reports into one HTML report when a shard fails ────
  e2e-merge-reports:
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Download all blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: apps/web
        run: bun x playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-html-report
          path: apps/web/playwright-report/
          retention-days: 14
