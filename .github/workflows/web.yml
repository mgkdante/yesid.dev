name: web

# CI for apps/web (SvelteKit, deployed by Vercel), on pull requests only. The
# `ci` job (type check, unit tests, shared-package tests, build) is the
# required check and runs on every PR. e2e runs three Playwright shards against
# a local hermetic preview after `ci`; the `skip-e2e` PR label skips it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turbo Remote Cache: when TURBO_TOKEN (a Vercel access token) and TURBO_TEAM
# (the Vercel team slug) are set as a repo secret + variable, `turbo run` shares
# a content-addressed cache across every run/branch/PR, so check/test/build go
# near-instant on unchanged inputs (even on a fresh PR). The credential is
# scoped only to the steps that invoke Turbo; every action and other step
# stays outside that trust boundary. Empty values degrade gracefully to the
# local .turbo/cache. One-time setup: `bunx turbo login && bunx turbo link`,
# then add the TURBO_TOKEN secret + TURBO_TEAM variable.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      # One Turbo run so check, test and build share the runner in parallel. The
      # build env matches the e2e shards' build, so they replay this cache entry
      # instead of rebuilding (Turbo hashes PUBLIC_* for SvelteKit).
      - name: Type check, unit tests and build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          EXPORT_FALLBACKS_SOURCE: "fixture"
          PUBLIC_PLAUSIBLE_DOMAIN: "yesid.dev"
        run: bun x turbo run check test build --filter=@repo/web

      - name: Brand gates
        run: bun run --cwd apps/web lint:design

      - name: Product shared-package tests
        run: bun run --cwd packages/shared test

      - name: Client payload budgets
        working-directory: apps/web
        run: bun run check:client-payload

      - name: Content-Security-Policy check
        working-directory: apps/web
        run: bun run check:csp

  # ── E2E (Playwright) against a local hermetic preview ──────────────────────
  # The webServer previews the fixture build on :4173: no CMS calls and no
  # Vercel edge requests.
  e2e:
    if: >-
      ${{ github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'skip-e2e') }}
    # Gate the 3 shards on the ci job: its build populates the Turbo remote
    # cache, so shards replay it instead of running 4 identical builds.
    needs: [ci]
    runs-on: ubuntu-latest
    # Shards split by test count and run serially on one worker each.
    timeout-minutes: 30
    # Shard across 3 runners; each replays the ci build and runs ~1/3 of the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      # The runner image already ships Chromium's system libraries. --with-deps
      # only added extra fonts and package upgrades through apt, which a slow
      # Ubuntu mirror stalled for up to 10 minutes. The browser download takes seconds.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bun x playwright install chromium

      # Replays the ci build from the Turbo cache, so the Playwright webServer only
      # previews it (E2E_PREBUILT). Keep this env identical to the ci build step.
      - name: Build (turbo, cache-eligible)
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          EXPORT_FALLBACKS_SOURCE: "fixture"
          PUBLIC_PLAUSIBLE_DOMAIN: "yesid.dev"
        run: bun x turbo run build --filter=@repo/web

      - name: Playwright e2e (shard ${{ matrix.shard }}/3, local hermetic preview)
        working-directory: apps/web
        env:
          E2E_PREBUILT: "1"
        run: >-
          bun x playwright test
          --shard=${{ matrix.shard }}/3
          --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 14

  # ── Merge the shard blob reports into one HTML report when a shard fails ────
  e2e-merge-reports:
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Download all blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: apps/web
        run: bun x playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-html-report
          path: apps/web/playwright-report/
          retention-days: 14
