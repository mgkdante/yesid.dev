name: cms

# CI for apps/cms (Directus config → Railway).
#
# Task 22 (post-21): replaced curl-based /schema/diff + /schema/apply with
# `bun run sync:diff` / `bun run sync:push` — directus-sync CLI backed by
# directus-extension-sync@3.0.6 on the Railway Directus image.
#
# Jobs:
# - test-work (PR/dispatch): apps/cms unit tests (no network or CMS credentials).
# - test (always): required-check reporter; main pushes reuse the merged PR gate.
# - diff (main PR): required credential-free validation of the committed
#   Directus snapshot contracts. Offline; never receives CMS credentials.
# - live-diff (push to main or main-only diff dispatch): read-only preview of
#   what sync:push WOULD apply against prod, from trusted main code only.
# - push (workflow_dispatch with action=push): applies the JSON tree to
#   cms.yesid.dev. Gated behind production environment for operator review.
# - permission-control-audit (workflow_dispatch): GET-only semantic comparison
#   of the repository permission declaration with production.
# - buildbot-cover-permission (workflow_dispatch): production-only four-cover
#   preview, approved create, or receipt-bound preview/rollback.
#
# slice-17f Phase 7: shared setup extracted to .github/actions/setup
# (Bun + cache restores + install). concurrency cancel-in-progress on
# pull_request kills duplicate runs on force-push / fast follow-up commits.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DIRECTUS_PROD_ADMIN_TOKEN      = static admin token (cms.yesid.dev/admin →
#                                    User Profile → Token → Generate). Bypasses
#                                    OTP — required since admin enrolled 2FA in
#                                    slice 18j (2026-04-30).
# DIRECTUS_URL is hardcoded (public domain — not a secret).
#
# Source: Notion slice-18 plan, Phase 2 Task 22.

on:
  # slice-17f Phase 8: path filters removed (test/diff jobs are required
  # status checks on main; required checks must always run or the merge
  # gate hangs on docs-only PRs). Phase 7 caches make no-op runs cheap.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: diff preview, push config apply, flows-only push, read-only permission audit, guarded cover permission'
        type: choice
        options: [diff, push, flows-push, permission-control-audit, buildbot-cover-permission-preview, buildbot-cover-permission-apply, buildbot-cover-permission-rollback-preview, buildbot-cover-permission-rollback]
        default: diff
        required: true
      include_permissions:
        description: 'Include directus_permissions collection in push (dangerous; default false)'
        type: boolean
        default: false
        required: false
      cover_permission_approval_sha256:
        description: 'Cover apply/rollback only: exact reviewed preview plan SHA-256 after direct human approval'
        type: string
        required: false
      cover_permission_apply_run_id:
        description: 'Cover rollback preview/rollback only: completed main CMS apply run containing apply.json (may have failed verification)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

# Cancel in-progress duplicate runs on PR pushes; let main pushes
# AND workflow_dispatch (which may apply to prod) run to completion.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: mgkdante/yesid.dev-design/.github/actions/classify-paths@a4e9d0e3b42da8121b5e9f98de2e315ad48e8f25
        id: classify
        with:
          github-token: ${{ github.token }}
          rules-json: >-
            {
              "schema": 1,
              "always": {
                "paths": [".bun-version", ".github/scripts/materialize-shared-config.mjs", ".github/shared-tooling.json", ".github/workflows/cms.yml", ".npmrc", "bun.lock", "package.json", "turbo.json"],
                "prefixes": [".github/actions/", ".github/scripts/", ".github/shared-tooling/", ".github/workflows/"]
              },
              "jobs": {
                "test-work": {
                  "paths": [".githooks/pre-commit"],
                  "prefixes": ["apps/cms/", "apps/web/", "gbp-assets/", "packages/"]
                }
              },
              "ignore": {
                "docs-only": {
                  "paths": ["AGENTS.md", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "LICENSE", "README.md", "SECURITY.md", "SUPPORT.md", "THIRD_PARTY_NOTICES.md"],
                  "prefixes": ["docs/"]
                },
                "irrelevant": {
                  "paths": [".env.example", ".gitattributes", ".gitignore", ".gitleaks.toml", ".gitleaksignore", "DESIGN.md"],
                  "prefixes": [".githooks/"]
                }
              }
            }

  test-work:
    needs: [classify]
    if: ${{ github.event_name != 'push' && fromJSON(needs.classify.outputs.classification).relevant['test-work'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: Run apps/cms unit tests (fixtures + seed dry-runs + sync-push + lib)
        working-directory: apps/cms
        run: bun test

      # Schema codegen drift check removed in slice-28.3 (#78): the generated
      # packages/shared/src/types/directus-schema.ts had zero consumers, and
      # this step hit the prod CMS on every test run. The generator
      # (apps/cms/scripts/generate-types.ts) was deleted with it.

  test:
    name: test
    needs: [classify, test-work]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve trusted main-push dependency
        if: ${{ github.event_name == 'push' }}
        run: ':'

      - uses: mgkdante/yesid.dev-design/.github/actions/required-context@a4e9d0e3b42da8121b5e9f98de2e315ad48e8f25
        if: ${{ github.event_name != 'push' }}
        with:
          needs-json: ${{ toJSON(needs) }}

  diff:
    # Keep the required main-PR `diff` status without exposing production.
    # The full test job already runs this contract; repeating the narrow suite
    # preserves the branch-rule check name while staying offline and secret-free.
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: Validate committed Directus snapshot contracts (offline, no CMS)
        working-directory: apps/cms
        run: bun test tests/snapshot-contract.test.ts

  live-diff:
    # The live comparison needs the production API, so it runs only after main
    # is trusted: immediately post-merge or by an explicit dispatch from main.
    if: |
      !cancelled() &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.action == 'diff'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    env:
      DIRECTUS_URL: https://cms.yesid.dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: sync:diff — preview diff vs prod
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
        run: bun run sync:diff

  push:
    # Apply apps/cms/directus/**.json to cms.yesid.dev. workflow_dispatch only.
    # Gated by environment:production for operator review. WARN: schema/
    # permissions/flows changes can affect live content — review diff first.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    environment:
      name: production
      url: https://cms.yesid.dev
    env:
      DIRECTUS_URL: https://cms.yesid.dev
      DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: sync:push — apply to production
        working-directory: apps/cms
        env:
          DIRECTUS_SYNC_ALLOW_PROD_SCHEMA_PUSH: '1'
          DIRECTUS_SYNC_PUSH_ACK: sync-push-can-delete-cms-data
          DIRECTUS_SYNC_INCLUDE_PERMISSIONS: ${{ inputs.include_permissions && '1' || '' }}
          DIRECTUS_SYNC_PERMISSIONS_ACK: ${{ inputs.include_permissions && 'permissions-push-can-delete-parallel-work' || '' }}
        run: bun run sync:push

  permission-control-audit:
    # Read-only semantic comparison by policy name + collection + action. This
    # job cannot invoke either a permission reconciler or directus-sync.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'permission-control-audit' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    environment:
      name: production
      url: https://cms.yesid.dev
    env:
      PUBLIC_DIRECTUS_URL: https://cms.yesid.dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: Audit production Directus permissions semantically (read-only)
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
        run: bun scripts/audit-permission-control-drift.ts --target=prod --dry-run

  flows-push:
    # Pushes only the flows collection.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'flows-push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    environment:
      name: production
      url: https://cms.yesid.dev
    env:
      DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
      DIRECTUS_URL: https://cms.yesid.dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: Baseline permission-control drift audit (read-only)
        working-directory: apps/cms
        continue-on-error: true
        run: bun scripts/audit-permission-control-drift.ts --target=prod --dry-run

      - name: Preflight configuration diff
        working-directory: apps/cms
        run: bun run sync:diff

      - name: Push flows collection only
        working-directory: apps/cms
        env:
          DIRECTUS_SYNC_ALLOW_PROD_SCHEMA_PUSH: '1'
          DIRECTUS_SYNC_PUSH_ACK: sync-push-can-delete-cms-data
        run: bun run sync:push -- --no-snapshot --only-collections flows

      - name: Converge configuration diff
        working-directory: apps/cms
        run: bun run sync:diff

  buildbot-cover-permission:
    # New access requires direct human approval of the exact preview hash.
    # Preview cannot write; rollback can delete only its receipt's created row.
    if: |
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.action == 'buildbot-cover-permission-preview' ||
        github.event.inputs.action == 'buildbot-cover-permission-apply' ||
        github.event.inputs.action == 'buildbot-cover-permission-rollback-preview' ||
        github.event.inputs.action == 'buildbot-cover-permission-rollback'
      ) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: https://cms.yesid.dev
    env:
      PUBLIC_DIRECTUS_URL: https://cms.yesid.dev
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: ./.github/actions/setup

      - name: Preview production Build Bot cover permission
        if: github.event.inputs.action == 'buildbot-cover-permission-preview' || github.event.inputs.action == 'buildbot-cover-permission-apply'
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
        run: >-
          bun scripts/reconcile-buildbot-cover-permission.ts
          --target=prod --dry-run --receipt=.permission-receipts/preview.json

      - name: Apply approved production Build Bot cover permission
        if: github.event.inputs.action == 'buildbot-cover-permission-apply'
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
          APPROVAL_SHA256: ${{ inputs.cover_permission_approval_sha256 }}
        run: >-
          bun scripts/reconcile-buildbot-cover-permission.ts
          --target=prod --apply --confirm=APPLY_PROD_BUILDBOT_COVER_PERMISSION
          --approval-sha256="$APPROVAL_SHA256" --receipt=.permission-receipts/apply.json

      - name: Validate prior cover permission apply run
        if: github.event.inputs.action == 'buildbot-cover-permission-rollback-preview' || github.event.inputs.action == 'buildbot-cover-permission-rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_APPLY_RUN_ID: ${{ inputs.cover_permission_apply_run_id }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_APPLY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'A numeric prior apply run ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_APPLY_RUN_ID" |
            jq -e '.event == "workflow_dispatch" and .head_branch == "main" and .path == ".github/workflows/cms.yml" and .status == "completed"' > /dev/null

      - name: Download prior cover permission apply receipt
        if: github.event.inputs.action == 'buildbot-cover-permission-rollback-preview' || github.event.inputs.action == 'buildbot-cover-permission-rollback'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: buildbot-cover-permission
          run-id: ${{ inputs.cover_permission_apply_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: apps/cms/.permission-prior

      - name: Preview receipt-bound Build Bot cover rollback
        if: github.event.inputs.action == 'buildbot-cover-permission-rollback-preview' || github.event.inputs.action == 'buildbot-cover-permission-rollback'
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
        run: >-
          bun scripts/reconcile-buildbot-cover-permission.ts
          --target=prod --dry-run --rollback=.permission-prior/apply.json
          --receipt=.permission-receipts/rollback-preview.json

      - name: Roll back approved Build Bot cover permission
        if: github.event.inputs.action == 'buildbot-cover-permission-rollback'
        working-directory: apps/cms
        env:
          DIRECTUS_ADMIN_TOKEN: ${{ secrets.DIRECTUS_PROD_ADMIN_TOKEN }}
          APPROVAL_SHA256: ${{ inputs.cover_permission_approval_sha256 }}
        run: >-
          bun scripts/reconcile-buildbot-cover-permission.ts
          --target=prod --apply --confirm=ROLLBACK_PROD_BUILDBOT_COVER_PERMISSION
          --rollback=.permission-prior/apply.json --approval-sha256="$APPROVAL_SHA256"
          --receipt=.permission-receipts/rollback.json

      - name: Preserve cover permission receipts, including failed verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildbot-cover-permission
          path: apps/cms/.permission-receipts/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
